# 1. This controls the name of the generated Xcode project file (e.g., iNetHack.xcodeproj)
name: iNetHack

options:
  bundleIdPrefix: com.futureshocksoftware

targets:
  iNetHack: 
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    info:
      path: Info.plist

    frameworks:
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      - sdk: CoreGraphics.framework

    sources:
      # --- TARGETED OBJECTIVE-C COMPILE OVERRIDE ---
      - path: Classes
        compilerFlags: "-x objective-c"
        
      - path: Settings.bundle
      - path: nethack
        excludes:
          - "**/README.xcode"
          - "**/README.md"          
          - "**/Info.plist"         
          - "**/Makefile*"          
          - "**/*.rc"               
          - "**/sys/vms/**"            
          - "**/sys/unix/**"           
          - "**/sys/windows/**"        
          - "**/sys/amiga/**"          
          - "**/sys/msdos/**"          
          - "**/sys/share/**"          
          - "**/outdated/**"           
          
          # --- WINDOW SYSTEM STRIPIFY FILTERS ---
          - "**/win/Qt/**"          
          - "**/win/X11/**"         
          - "**/win/gem/**"         
          - "**/win/gnome/**"       
          - "**/win/proxy/**"       
          - "**/win/tty/**"         
          - "**/win/chain/**"       
          - "**/win/win32/**"       
          
          # --- SPECIFIC DESKTOP IMAGE PARSER BLOCKERS ---
          # This cleans out giftiles.c, gifread.c, bmptiles.c, and tileset.c all at once!
          - "**/win/share/*tiles.c" 
          - "**/win/share/*read.c"  

          # --- AUDIO BACKEND ENGINE FILTERS ---
          - "**/sound/**"           
          
          # --- UTILITY & API LIBRARY FILTERS ---
          - "**/util/**"            
          - "**/sys/libnh/**"       

          # --- PDCURSES ALL SUBMODULE EXCLUSIONS ---
          - "**/submodules/pdcurses/**"       
          - "**/submodules/pdcursesmod/**"    
          - "**/submodules/lua/testes/**"             
          - "**/*.xpm"                             
          - "**/*.mif"                             
          - "**/*.md"                              
      - path: gfx
      - path: iNethack2
      - path: Tilesets
      
    settings:
      base:
        GCC_C_LANGUAGE_STANDARD: gnu99
        PRODUCT_NAME: iNethack2 
        PRODUCT_BUNDLE_IDENTIFIER: com.futureshocksoftware.inethack2
        MARKETING_VERSION: "2.1.5"       
        CURRENT_PROJECT_VERSION: "46"    
        
        CLANG_ENABLE_OBJC_ARC: NO       
        
        GCC_PREPROCESSOR_DEFINITIONS:
          - "LUA_USE_DLOPEN=1"
          - "l_system(x)=-1"
        
        HEADER_SEARCH_PATHS: 
          - "$(SRCROOT)/nethack/include"
          - "$(SRCROOT)/nethack/sys/share"          
          - "$(SRCROOT)/nethack/win/share"          
          - "$(SRCROOT)/nethack/submodules/lua"     
          - "$(SRCROOT)/nethack/submodules/lua/src" 
          - "$(SRCROOT)/nethack/submodules/pdcursesmod"
