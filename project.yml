# 1. This controls the name of the generated Xcode project file (e.g., iNetHack.xcodeproj)
name: iNetHack

options:
  bundleIdPrefix: com.futureshocksoftware

targets:
  iNetHack: 
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    info:
      path: Info.plist

    frameworks:
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      - sdk: CoreGraphics.framework

    sources:
      - path: Classes
      - path: Settings.bundle
      - path: nethack
        excludes:
          - "**/README.xcode"
          - "**/README.md"          
          - "**/Info.plist"         
          - "**/Makefile*"          
          - "**/*.rc"               
          - "**/sys/vms/**"            
          - "**/sys/unix/**"           
          - "**/sys/windows/**"        
          - "**/sys/amiga/**"          
          - "**/sys/msdos/**"          
          - "**/sys/share/**"          
          - "**/outdated/**"           
          
          # --- WINDOW SYSTEM STRIPIFY FILTERS ---
          - "**/win/Qt/**"          
          - "**/win/X11/**"         
          - "**/win/gem/**"         
          - "**/win/gnome/**"       
          - "**/win/proxy/**"       
          - "**/win/tty/**"         
          - "**/win/chain/**"       

          # --- AUDIO BACKEND ENGINE FILTERS ---
          - "**/sound/**"           
          
          # --- UTILITY COMPILER ENGINE FILTERS ---
          - "**/util/**"            # <-- Fixes the sfproto.h missing file error completely

          # --- PDCURSES ALL SUBMODULE EXCLUSIONS ---
          - "**/submodules/pdcurses/**"       
          - "**/submodules/pdcursesmod/**"    
          - "**/submodules/lua/testes/**"             
          - "**/*.xpm"                             
          - "**/*.mif"                             
          - "**/*.md"                              
      - path: gfx
      - path: iNethack2
      - path: Tilesets
      
    settings:
      base:
        GCC_C_LANGUAGE_STANDARD: gnu99
        PRODUCT_NAME: iNethack2 
        PRODUCT_BUNDLE_IDENTIFIER: com.futureshocksoftware.inethack2
        MARKETING_VERSION: "2.1.5"       
        CURRENT_PROJECT_VERSION: "46"    
        
        CLANG_ENABLE_OBJC_ARC: NO       
        OTHER_CFLAGS: "-x objective-c"  
        
        HEADER_SEARCH_PATHS: 
          - "$(SRCROOT)/nethack/include"
          - "$(SRCROOT)/nethack/sys/share"          
          - "$(SRCROOT)/nethack/submodules/lua"     
          - "$(SRCROOT)/nethack/submodules/lua/src" 
          - "$(SRCROOT)/nethack/submodules/pdcursesmod" 
