# 1. This controls the name of the generated Xcode project file (e.g., iNetHack.xcodeproj)
name: iNetHack

options:
  bundleIdPrefix: com.futureshocksoftware

targets:
  iNetHack: 
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    info:
      path: Info.plist

    frameworks:
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      - sdk: CoreGraphics.framework

    sources:
      # --- TARGETED COMPILER OVERRIDES FOR IOS FRONTEND CODE ---
      - path: Classes
        compilerFlags: "-x objective-c"
      - path: win/iphone
        compilerFlags: "-x objective-c -Wno-error=incompatible-function-pointer-types -Wno-initializer-overrides"
      - path: Settings.bundle
      - path: nethack
        excludes:
          - "**/README.xcode"
          - "**/README.md"          
          - "**/Info.plist"         
          - "**/Makefile*"          
          - "**/*.rc"               
          - "**/sys/vms/**"            
          - "**/sys/unix/**"           
          - "**/sys/windows/**"        
          - "**/sys/amiga/**"          
          - "**/sys/msdos/**"          
          - "**/sys/share/**"          
          - "**/outdated/**"           
          
          # --- WINDOW SYSTEM STRIPIFY FILTERS ---
          - "**/win/Qt/**"          
          - "**/win/X11/**"         
          - "**/win/gem/**"         
          - "**/win/gnome/**"       
          - "**/win/proxy/**"       
          - "**/win/tty/**"         
          - "**/win/chain/**"       
          - "**/win/win32/**"       
          - "**/win/share/**" 

          # --- AUDIO BACKEND ENGINE FILTERS ---
          - "**/sound/**"           
          
          # --- UTILITY & API LIBRARY FILTERS ---
          - "**/util/**"            
          - "**/sys/libnh/**"       

          # --- PDCURSES ALL SUBMODULE EXCLUSIONS ---
          - "**/submodules/pdcurses/**"       
          # --- RE-ALIGNED PDCURSES SUBMODULE EXCLUSIONS ---
          # We remove the blanket filter so Xcode Gen can compile the abstract core window buffers!
          - "**/submodules/pdcursesmod/cmake/**"      
          - "**/submodules/pdcursesmod/dos*/**"       
          - "**/submodules/pdcursesmod/gl/**"         
          - "**/submodules/pdcursesmod/ncurses/**"    
          - "**/submodules/pdcursesmod/os2*/**"       
          - "**/submodules/pdcursesmod/sdl*/**"       
          - "**/submodules/pdcursesmod/vt/**"          
          - "**/submodules/pdcursesmod/win*/**"       
          - "**/submodules/pdcursesmod/x11/**"        
          - "**/submodules/pdcursesmod/docs/**"       
          - "**/submodules/pdcursesmod/demos/**"
          - "**/submodules/pdcursesmod/common/**"
          - "**/submodules/pdcursesmod/plan9/**"      # <-- Fixes the lock.h error instantly
          - "**/submodules/pdcursesmod/x11new/**"     # <-- Blocks the loose X11 variant dependencies
          # Note: We do NOT block 'submodules/pdcursesmod/pdcurses/**' anymore!    
          - "**/submodules/lua/testes/**"             
          - "**/*.xpm"                             
          - "**/*.mif"                             
          - "**/*.md"                              
      - path: gfx
      - path: iNethack2
      - path: Tilesets
      
    settings:
      base:
        GCC_C_LANGUAGE_STANDARD: gnu99
        PRODUCT_NAME: iNethack2 
        PRODUCT_BUNDLE_IDENTIFIER: com.futureshocksoftware.inethack2
        MARKETING_VERSION: "2.1.5"       
        CURRENT_PROJECT_VERSION: "46"    
        
        CLANG_ENABLE_OBJC_ARC: NO       
        
        GCC_PREPROCESSOR_DEFINITIONS:
          - "LUA_USE_DLOPEN=1"
          - "l_system(x)=-1"
        
        HEADER_SEARCH_PATHS: 
          - "$(SRCROOT)/nethack/include"
          - "$(SRCROOT)/nethack/sys/share"          
          - "$(SRCROOT)/nethack/win/share"          
          - "$(SRCROOT)/nethack/submodules/lua"     
          - "$(SRCROOT)/nethack/submodules/lua/src" 
          - "$(SRCROOT)/nethack/submodules/pdcursesmod"
