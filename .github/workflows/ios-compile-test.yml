name: iOS Compilation Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Fix Misplaced Entitlements Warning
        run: |
          # Automatically strips the Entitlements.plist out of the Copy Bundle Resources phase 
          # so Xcode doesn't throw a validation warning/error during headless builds.
          sed -i '' '/Entitlements.plist/d' iNetHack.xcodeproj/project.pbxproj

      - name: Compile Full NetHack Target Dependency Chain
        run: |
          # We explicitly pass '-configuration Debug' and SDK parameters to force
          # xcodebuild out of physical 'Distribution-iphoneos' mode.
          xcodebuild build \
            -project "iNetHack.xcodeproj" \
            -target "iNetHack2" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
