name: iOS Compilation Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Fix Misplaced Entitlements Warning
        run: |
          # Automatically strips the Entitlements.plist out of the Copy Bundle Resources phase 
          # so Xcode doesn't throw a validation warning/error during headless builds.
          sed -i '' '/Entitlements.plist/d' iNetHack.xcodeproj/project.pbxproj

      - name: Compile Complete Project Environment
        run: |
          # Dropping the isolated target flag and using the global 'alltargets' action 
          # forces Xcode to process the background tools that generate 'nhdat' first.
          xcodebuild build \
            -project "iNetHack.xcodeproj" \
            -alltargets \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
