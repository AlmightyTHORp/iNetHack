name: iOS Compilation Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Fix Misplaced Entitlements Warning
        run: |
          sed -i '' '/Entitlements.pbxproj/d' iNetHack.xcodeproj/project.pbxproj || true
          sed -i '' '/Entitlements.plist/d' iNetHack.xcodeproj/project.pbxproj || true

      - name: "Step 1: Generate tile.c and Mirror Layout via Absolute Paths"
        run: |
          # 1. Compile NetHack's tool and manually run it to generate the missing tile.c file
          echo "Compiling native tilemap utility..."
          clang -I include src/tilemap.c -o src/tilemap
          
          echo "Executing tilemap utility to physically write src/tile.c..."
          cd src && ./tilemap && cd ..

          # 2. Build the exact physical directory structures Xcode expects
          mkdir -p nethack
          mkdir -p dat
          mkdir -p lib
          touch lib/.gitkeep

          # 3. Create absolute path symlinks to link root folders into the nethack/ directory
          ln -s "$GITHUB_WORKSPACE/src" "$GITHUB_WORKSPACE/nethack/src"
          ln -s "$GITHUB_WORKSPACE/include" "$WORKSPACE_PATH/nethack/include" || ln -s "$GITHUB_WORKSPACE/include" "$GITHUB_WORKSPACE/nethack/include"
          ln -s "$GITHUB_WORKSPACE/dat" "$GITHUB_WORKSPACE/nethack/dat"
          ln -s "$GITHUB_WORKSPACE/lib" "$GITHUB_WORKSPACE/nethack/lib"

          # 4. Inject empty dummy placeholders to clear final resource copying blockers
          touch dat/nhdat
          touch nethack/dat/nhdat

      - name: "Step 2: Compile App Environment (iOS Simulator Pass)"
        run: |
          RUNNER_ARCH=$(uname -m)
          
          xcodebuild build \
            -project "iNetHack.xcodeproj" \
            -target "iNetHack2" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="$RUNNER_ARCH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            XCODE_BUILD_SYSTEM_ENABLE_EAGER_LINKING=NO
