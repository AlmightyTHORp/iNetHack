name: iOS Compilation Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Fix Misplaced Entitlements Warning
        run: |
          sed -i '' '/Entitlements.pbxproj/d' iNetHack.xcodeproj/project.pbxproj || true
          sed -i '' '/Entitlements.plist/d' iNetHack.xcodeproj/project.pbxproj || true

      - name: "Step 1: Initialize Folder Asset Shells"
        run: |
          # Create data structures to handle standard resource copy stages smoothly
          mkdir -p dat
          mkdir -p lib
          touch lib/.gitkeep
          mkdir -p nethack/dat
          mkdir -p nethack/lib
          touch nethack/lib/.gitkeep

      - name: "Step 2: Compile Full Scheme (iOS Simulator Pass)"
        run: |
          RUNNER_ARCH=$(uname -m)
          
          # Dropping '-target' and using '-scheme' forces Xcode to evaluate 
          # the asset generation utilities first, outputting a real populated tile.c 
          # before compiling the front-end code.
          xcodebuild build \
            -project "iNetHack.xcodeproj" \
            -scheme "iNetHack2" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="$RUNNER_ARCH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            XCODE_BUILD_SYSTEM_ENABLE_EAGER_LINKING=NO
