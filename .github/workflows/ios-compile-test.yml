name: iOS Compilation Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Fix Misplaced Entitlements Warning
        run: |
          sed -i '' '/Entitlements.pbxproj/d' iNetHack.xcodeproj/project.pbxproj || true
          sed -i '' '/Entitlements.plist/d' iNetHack.xcodeproj/project.pbxproj || true

      - name: "Step 1: Initialize Root and Nested Target Asset Structure"
        run: |
          # 1. Clear root-level copy folder constraints
          mkdir -p dat
          touch dat/nhdat
          mkdir -p lib
          touch lib/.gitkeep

          # 2. Clear nested subfolder copy constraints
          mkdir -p nethack/dat
          touch nethack/dat/nhdat
          mkdir -p nethack/lib
          touch nethack/lib/.gitkeep

      - name: "Step 2: Compile App Environment (iOS Simulator Pass)"
        run: |
          RUNNER_ARCH=$(uname -m)
          
          xcodebuild build \
            -project "iNetHack.xcodeproj" \
            -target "iNetHack2" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="$RUNNER_ARCH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            XCODE_BUILD_SYSTEM_ENABLE_EAGER_LINKING=NO
