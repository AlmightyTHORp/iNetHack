name: iOS Compilation Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Fix Misplaced Entitlements Warning
        run: |
          sed -i '' '/Entitlements.plist/d' iNetHack.xcodeproj/project.pbxproj

      - name: Step 1: Generate NetHack Game Data (Native Mac Pass)
        run: |
          # We build using the macOS SDK first. This compiles 'lev_comp' and 'makedefs' 
          # as native Mac tools, allowing them to execute on the runner and successfully 
          # output 'nhdat', 'tower.des', and all game assets into the project directory.
          xcodebuild build \
            -project "iNetHack.xcodeproj" \
            -alltargets \
            -configuration Debug \
            -sdk macosx \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO || echo "Proceeding to iOS step with generated assets..."

      - name: Step 2: Compile App Environment (iOS Simulator Pass)
        run: |
          RUNNER_ARCH=$(uname -m)
          
          # Now that the data files have been baked by the Mac tools, we run the 
          # standard iOS simulator build. It will find the missing assets waiting 
          # for it and package them smoothly.
          xcodebuild build \
            -project "iNetHack.xcodeproj" \
            -target "iNetHack2" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="$RUNNER_ARCH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
