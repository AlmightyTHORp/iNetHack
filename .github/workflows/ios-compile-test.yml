name: iOS Compilation Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Fix Misplaced Entitlements Warning
        run: |
          # Automatically strips the Entitlements.plist out of the Copy Bundle Resources phase 
          # so Xcode doesn't throw a validation warning/error during headless builds.
          sed -i '' '/Entitlements.plist/d' iNetHack.xcodeproj/project.pbxproj

      - name: Compile Full NetHack Target Dependency Chain
        run: |
          # Building with the default 'clean build' clears out the pre-compiled game data files.
          # We change 'clean build' to a standard 'build' action to ensure xcodebuild natively
          # invokes the nested target dependencies to generate 'nhdat' sequentially.
          xcodebuild build \
            -project "iNetHack.xcodeproj" \
            -target "iNetHack2" \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
