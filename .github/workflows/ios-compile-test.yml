name: iOS Compilation Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Fix Misplaced Entitlements Warning
        run: |
          # Automatically strips the Entitlements.plist out of the Copy Bundle Resources phase 
          # so Xcode doesn't throw a validation warning/error during headless builds.
          sed -i '' '/Entitlements.plist/d' iNetHack.xcodeproj/project.pbxproj

      - name: Compile Complete Project Environment
        run: |
          # 1. Determine the host runner architecture (x86_64 or arm64)
          RUNNER_ARCH=$(uname -m)
          echo "GitHub Runner Architecture is: $RUNNER_ARCH"

          # 2. Force ONLY_ACTIVE_ARCH=NO and hardcode the explicit ARCHS 
          # matching the simulator host to cleanly isolate asset file generation steps.
          xcodebuild build \
            -project "iNetHack.xcodeproj" \
            -alltargets \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="$RUNNER_ARCH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
