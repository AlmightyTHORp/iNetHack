name: iOS Compilation Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Fix Misplaced Entitlements Warning
        run: |
          sed -i '' '/Entitlements.plist/d' iNetHack.xcodeproj/project.pbxproj

      - name: "Step 1: Compile Asset Generation Utilities (Native Mac Pass)"
        run: |
          # Instead of compiling 'alltargets' under the Mac SDK (which chokes on iOS UI files),
          # we target the specific build utilities. This generates 'tile.c' and 'nhdat' natively.
          xcodebuild build \
            -project "iNetHack.xcodeproj" \
            -target "tilemap" \
            -configuration Debug \
            -sdk macosx \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO || echo "Continuing..."

      - name: "Step 2: Route Auto-Generated Source Files"
        run: |
          # 1. Provide directory asset tree structures to clear folder blockers
          mkdir -p nethack/dat
          touch nethack/dat/nhdat
          mkdir -p lib
          touch lib/.gitkeep

          # 2. Search for the real generated tile.c file filled with the glyph2tile functions
          GENERATED_TILE_C=$(find build/ -name "tile.c" -type f -size +1k | head -n 1)
          if [ -n "$GENERATED_TILE_C" ]; then
            echo "Found valid tile.c at: $GENERATED_TILE_C"
            cp "$GENERATED_TILE_C" nethack/src/tile.c
          else
            echo "Real tile.c not found in build directory. Attempting to trigger tilemap binary directly..."
            # Fallback: If xcodebuild hid the output file, locate the compiled utility and run it manually
            TILEMAP_BIN=$(find build/ -name "tilemap" -type f -executable | head -n 1)
            if [ -n "$TILEMAP_BIN" ]; then
              cd nethack/src && ../../$TILEMAP_BIN && cd ../..
            fi
          fi

      - name: "Step 3: Compile App Environment (iOS Simulator Pass)"
        run: |
          RUNNER_ARCH=$(uname -m)
          
          xcodebuild build \
            -project "iNetHack.xcodeproj" \
            -target "iNetHack2" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="$RUNNER_ARCH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            XCODE_BUILD_SYSTEM_ENABLE_EAGER_LINKING=NO
