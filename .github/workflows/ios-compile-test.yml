name: iOS Compilation Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Fix Misplaced Entitlements Warning
        run: |
          sed -i '' '/Entitlements.pbxproj/d' iNetHack.xcodeproj/project.pbxproj || true
          sed -i '' '/Entitlements.plist/d' iNetHack.xcodeproj/project.pbxproj || true

      - name: "Step 1: Bridge Absolute Multi-Layout File System Tree"
        run: |
          # 1. Establish core target folders to capture bundle asset copiers smoothly
          mkdir -p dat
          mkdir -p lib
          touch lib/.gitkeep

          # 2. Build the exact nested parent directory that Xcode's hardcoded paths mirror
          mkdir -p nethack

          # 3. Implement universal loop mirroring using absolute paths. 
          # This bridges every individual workspace entity (including hidden tools, 
          # asset layouts, and config blocks) into the subfolder structure seamlessly.
          for entity in *; do
            if [ "$entity" != "nethack" ]; then
              ln -s "$GITHUB_WORKSPACE/$entity" "$GITHUB_WORKSPACE/nethack/$entity"
            fi
          done

          # 4. Inject empty resource markers across both paths to prevent copier validation issues
          touch dat/nhdat
          touch nethack/dat/nhdat

      - name: "Step 2: Compile App Environment (iOS Simulator Pass)"
        run: |
          RUNNER_ARCH=$(uname -m)
          
          # This triggers the standard iOS simulator build against the unified file system tree.
          xcodebuild build \
            -project "iNetHack.xcodeproj" \
            -target "iNetHack2" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="$RUNNER_ARCH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            XCODE_BUILD_SYSTEM_ENABLE_EAGER_LINKING=NO
