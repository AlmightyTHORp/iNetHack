name: iOS Compilation Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Fix Misplaced Entitlements Warning
        run: |
          sed -i '' '/Entitlements.pbxproj/d' iNetHack.xcodeproj/project.pbxproj || true
          sed -i '' '/Entitlements.plist/d' iNetHack.xcodeproj/project.pbxproj || true

      - name: "Step 1: Dynamically Generate Missing NetHack Core Files"
        run: |
          # 1. Establish necessary structural folder shells
          mkdir -p dat
          mkdir -p lib
          touch lib/.gitkeep

          # 2. Compile NetHack's native 'tilemap' engine component using absolute references
          echo "Compiling the native tilemap code generator tool..."
          clang -I "$GITHUB_WORKSPACE/include" "$GITHUB_WORKSPACE/src/tilemap.c" -o "$GITHUB_WORKSPACE/src/tilemap"

          # 3. Execute the generator tool directly in the source directory
          # This translates text definitions into the missing physical 'tile.c' file
          echo "Running tilemap to write tile.c..."
          cd "$GITHUB_WORKSPACE/src" && ./tilemap && cd "$GITHUB_WORKSPACE"

          # 4. Mirror the unified directory tree so Xcode finds the generated files inside 'nethack/'
          mkdir -p nethack
          for entity in *; do
            if [ "$entity" != "nethack" ]; then
              ln -s "$GITHUB_WORKSPACE/$entity" "$GITHUB_WORKSPACE/nethack/$entity"
            fi
          done

          # 5. Inject dummy assets to satisfy bundle copier validation checks
          touch dat/nhdat
          touch nethack/dat/nhdat

      - name: "Step 2: Compile App Environment (iOS Simulator Pass)"
        run: |
          RUNNER_ARCH=$(uname -m)
          
          xcodebuild build \
            -project "iNetHack.xcodeproj" \
            -target "iNetHack2" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="$RUNNER_ARCH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            XCODE_BUILD_SYSTEM_ENABLE_EAGER_LINKING=NO
