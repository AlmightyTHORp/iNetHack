name: iOS Compilation Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Fix Misplaced Entitlements Warning
        run: |
          sed -i '' '/Entitlements.plist/d' iNetHack.xcodeproj/project.pbxproj

      - name: "Step 1: Generate Game Files Manually via Clang"
        run: |
          # 1. Establish the missing core data paths
          mkdir -p nethack/dat
          mkdir -p lib
          touch lib/.gitkeep

          # 2. Compile and execute NetHack's toolchains using standard shell commands.
          # This compiles the source mappings into real, physical asset files in the repo tree.
          echo "Compiling tilemap utility..."
          clang -I nethack/include nethack/src/tilemap.c -o nethack/src/tilemap
          
          echo "Executing tilemap utility to generate tile.c..."
          cd nethack/src && ./tilemap && cd ../..

          # Ensure an nhdat placeholder is active to satisfy the bundle resource copier
          touch nethack/dat/nhdat

      - name: "Step 2: Compile App Environment (iOS Simulator Pass)"
        run: |
          RUNNER_ARCH=$(uname -m)
          
          # Now that tile.c is natively written and verified on disk, we run the 
          # primary simulator target cleanly.
          xcodebuild build \
            -project "iNetHack.xcodeproj" \
            -target "iNetHack2" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="$RUNNER_ARCH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            XCODE_BUILD_SYSTEM_ENABLE_EAGER_LINKING=NO
