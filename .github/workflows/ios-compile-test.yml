name: iOS Compilation Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Fix Misplaced Entitlements Warning
        run: |
          sed -i '' '/Entitlements.pbxproj/d' iNetHack.xcodeproj/project.pbxproj || true
          sed -i '' '/Entitlements.plist/d' iNetHack.xcodeproj/project.pbxproj || true

      - name: "Step 1: Initialize Nested Target Asset Structure"
        run: |
          # 1. Create the specific data folder paths that Xcode is querying
          mkdir -p nethack/dat
          mkdir -p nethack/lib
          touch nethack/lib/.gitkeep

          # 2. Inject the mock placeholder file directly where Xcode's 
          # hardcoded CpResource command expects to pull it from
          touch nethack/dat/nhdat

      - name: "Step 2: Compile App Environment (iOS Simulator Pass)"
        run: |
          RUNNER_ARCH=$(uname -m)
          
          # This compiles the standalone app target. Because tile.c is safely inside 
          # the repo at nethack/src/ and nhdat is provisioned above, it passes.
          xcodebuild build \
            -project "iNetHack.xcodeproj" \
            -target "iNetHack2" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="$RUNNER_ARCH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            XCODE_BUILD_SYSTEM_ENABLE_EAGER_LINKING=NO
