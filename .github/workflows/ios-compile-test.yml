name: iOS Compilation Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Fix Misplaced Entitlements Warning
        run: |
          sed -i '' '/Entitlements.plist/d' iNetHack.xcodeproj/project.pbxproj

      - name: "Step 1: Mirror Directory Tree Structure"
        run: |
          # 1. Create the parent folder that Xcode's hardcoded paths are looking for
          mkdir -p nethack

          # 2. Symlink the root source code and header directories into the nethack folder
          # This maps root files like 'src/tile.c' to 'nethack/src/tile.c' dynamically.
          ln -s ../src nethack/src
          ln -s ../include nethack/include
          ln -s ../dat nethack/dat
          ln -s ../lib nethack/lib

          # 3. Ensure target directories and dummy files exist to bypass bundle copier validations
          mkdir -p dat
          touch dat/nhdat
          mkdir -p lib
          touch lib/.gitkeep
          mkdir -p nethack/dat
          touch nethack/dat/nhdat

      - name: "Step 2: Compile App Environment (iOS Simulator Pass)"
        run: |
          RUNNER_ARCH=$(uname -m)
          
          xcodebuild build \
            -project "iNetHack.xcodeproj" \
            -target "iNetHack2" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="$RUNNER_ARCH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            XCODE_BUILD_SYSTEM_ENABLE_EAGER_LINKING=NO
